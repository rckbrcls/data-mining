[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disque100_research"
version = "0.1.0"
description = "Shared infrastructure for Disque 100 research notebooks"
requires-python = ">=3.11"
dependencies = [
    "damicore==0.2.0",
    "pandas>=3,<4",
    "psycopg[binary]>=3.2,<4",
    "networkx>=3.5,<4",
    "matplotlib>=3.10,<4",
    "biopython>=1.85,<2",
    "jupyterlab>=4,<5",
    "nbformat>=5,<6",
    "nbclient>=0.10,<1",
    "nbconvert>=7,<8"
]

[tool.setuptools.packages.find]
where = ["src"]
