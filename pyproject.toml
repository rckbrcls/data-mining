[project]
name = "data-mining-damicore"
version = "0.1.0"
description = "Dependencies for the Data Mining DAMICORE experiment over Disque 100 data"
requires-python = ">=3.11"
dependencies = [
    "damicore==0.2.0",
    "pandas>=3,<4",
    "psycopg[binary]>=3.2,<4",
    "matplotlib>=3.10,<4",
    "toytree>=3,<4",
    "toyplot>=2.1,<3",
    "jupyterlab>=4,<5",
    "nbformat>=5,<6",
    "nbclient>=0.10,<1",
    "nbconvert>=7,<8",
    "python-dotenv>=1,<2",
    "scikit-learn>=1.6,<2"
]

[tool.setuptools]
py-modules = []
